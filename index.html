      function renderCategorySelector(selectedCat) {
        const container = $('categorySelector');
        const hiddenInput = $('itemCategory');
        if (hiddenInput) hiddenInput.value = selectedCat;
        if (!container) return;

        container.innerHTML = CATEGORIES.map(cat => {
          const active = cat.id === selectedCat;
          return `

              ${getCategorySvg(cat.id, 15)}

      function updateFormExpiryPreview() {
        const startEl = $('itemStartDate');
        const expiryEl = $('itemExpiryDate');
        const preview = $('formExpiryPreview');
        if (!preview) return;

        const startVal = (startEl && startEl.value) || getTodayStr();
        const expiryVal = expiryEl ? expiryEl.value : '';

        if (!expiryVal) {
          preview.className = 'status-banner';
          preview.textContent = '尚未設定有效期限，之後隨時可補拍或補填。';
          return;
        }

        const totalDays = Math.max(1, daysBetween(startVal, expiryVal));
        const thresholdDays = Math.max(1, Math.ceil(totalDays / 5));
        const remainingDays = daysBetween(getTodayStr(), expiryVal);

        if (remainingDays < 0) {
          preview.className = 'status-banner is-expired';
          preview.innerHTML = `總效期 <strong>${totalDays} 天</strong>（1/5 門檻 ${thresholdDays} 天），此日期已過期 <strong>${Math.abs(remainingDays)} 天</strong>。`;
        } else if (remainingDays <= thresholdDays) {
          preview.className = 'status-banner is-warn';
          preview.innerHTML = `總效期 <strong>${totalDays} 天</strong>，將於剩餘 <strong>${thresholdDays} 天</strong>時提醒。目前剩餘 ${remainingDays} 天，將立即顯示於效期提醒看板。`;
        } else {
          preview.className = 'status-banner is-safe';
          preview.innerHTML = `總效期 <strong>${totalDays} 天</strong>，將於剩餘 <strong>${thresholdDays} 天</strong>時提醒（目前尚餘 ${remainingDays} 天）。`;
        }
      }

      function stopCameraStream() {
        try {
          if (state.cameraStream) {
            state.cameraStream.getTracks().forEach(track => track.stop());
            state.cameraStream = null;
          }
          const video = $('liveCameraVideo');
          if (video) video.srcObject = null;

      function handleCameraUnavailable() {
        stopCameraStream();
        if ($('cameraModal')) $('cameraModal').classList.add('hidden');
        state.cameraAvailable = false;
        syncCameraButtonsVisibility();
        showToast('目前環境無法直接開啟相機，請改用「相簿選取」上傳照片', 'info');
      }

      async function openLiveCamera(facingMode) {
        const targetFacing = facingMode || state.cameraFacingMode || 'environment';
        try {
          if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
            handleCameraUnavailable();
            return;
          }
          stopCameraStream();
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: targetFacing },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            },
            audio: false,
          });
          state.cameraStream = stream;
          state.cameraFacingMode = targetFacing;

          const video = $('liveCameraVideo');
          if (video) {
            video.srcObject = stream;
            await video.play();
          }
          if ($('cameraModal')) $('cameraModal').classList.remove('hidden');
        } catch (err) {
          handleCameraUnavailable();
        }
      }

      function closeLiveCamera() {
        stopCameraStream();
        if ($('cameraModal')) $('cameraModal').classList.add('hidden');
      }

      function makeThumbnailFromCanvas(sourceCanvas, maxDim) {
        let w = sourceCanvas.width;
        let h = sourceCanvas.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
        }
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        c.getContext('2d').drawImage(sourceCanvas, 0, 0, w, h);
        return c.toDataURL('image/jpeg', 0.72);
      }

      async function captureCameraFrame() {
        const video = $('liveCameraVideo');
        if (!video || !video.videoWidth || !video.videoHeight) {
          showToast('相機畫面尚未就緒，請稍候再拍', 'info');
          return;
        }

        const maxDim = 1280;
        let w = video.videoWidth;
        let h = video.videoHeight;
        if (w > maxDim || h > maxDim) {
          if (w > h) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(video, 0, 0, w, h);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.86);
        const base64Data = dataUrl.split(',')[1];
        const thumbnailDataUrl = makeThumbnailFromCanvas(canvas, 200);

        closeLiveCamera();
        if ($('itemModal') && $('itemModal').classList.contains('hidden')) {
          openItemModal(null);
        }
        await runGeminiVision({ dataUrl, base64Data, mimeType: 'image/jpeg', thumbnailDataUrl });
      }

      function compressFileToJpeg(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
              const maxDim = 1024;
              let w = img.width;
              let h = img.height;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
              resolve({
                dataUrl,
                base64Data: dataUrl.split(',')[1],
                mimeType: 'image/jpeg',
                thumbnailDataUrl: makeThumbnailFromCanvas(canvas, 200),
              });
            };
            img.onerror = () => reject(new Error('圖片載入失敗'));
            img.src = ev.target.result;
          };
          reader.onerror = () => reject(new Error('檔案讀取失敗'));
          reader.readAsDataURL(file);
        });
      }

      /* -----------------------------------------------------------------
         9. Gemini Vision API 辨識（指數退避 + 嚴格效期規則）
         ----------------------------------------------------------------- */
      async function fetchWithBackoff(url, options, maxRetries) {
        const retries = maxRetries || 3;
        let delay = 1000;
        for (let attempt = 0; attempt <= retries; attempt++) {
          try {
            const res = await fetch(url, options);
            if (res.ok) return res;
            if ((res.status === 429 || res.status >= 500) && attempt < retries) {
              await new Promise(r => setTimeout(r, delay));
              delay *= 2;
              continue;
            }
            throw new Error(`HTTP ${res.status}`);
          } catch (err) {
            if (attempt < retries) {
              await new Promise(r => setTimeout(r, delay));
              delay *= 2;
              continue;
            }
            throw err;
          }
        }
      }

      async function runGeminiVision({ dataUrl, base64Data, mimeType, thumbnailDataUrl }) {
        const previewBox = $('photoPreviewBox');
        const previewImg = $('photoPreviewImg');
        const scanOverlay = $('scanOverlay');
        const statusBanner = $('scanStatusBanner');

        if (previewImg) previewImg.src = dataUrl;
        state.formThumbnail = thumbnailDataUrl || null;
        if (previewBox) previewBox.classList.remove('hidden');
        if (scanOverlay) scanOverlay.classList.remove('hidden');
        if (statusBanner) statusBanner.classList.add('hidden');

        try {
          const prompt = `你是一位細心的繁體中文商品與有效期限辨識助手。請觀察這張照片並回傳 JSON：
1. name：商品名稱（繁體中文、簡潔明確）。若畫面只有瓶底效期特寫看不出商品，請回傳空字串 ""。
2. category：必須為「化妝品」、「保養品」、「盥洗用品」、「食品」、「保健品」、「其他」其中之一。
3. hasExpiryDate：布林值。只有照片中真的清楚拍到有效期限（如 EXP、BEST BEFORE、賞味期限、有效日期、BB 等）才為 true；否則必須為 false。
4. expiryDate：格式 YYYY-MM-DD 或空字串 ""。嚴格規定：只有 hasExpiryDate 為 true 時才填入日期（若只標示年月如 2027.08 請轉為 2027-08-01）；沒拍到或模糊無法確認時必須回傳 ""，絕對不可猜測！
5. note：簡短補充說明（例如容量或口味，沒有就回傳 ""）。`;

          const payload = {
            contents: [{
              role: 'user',
              parts: [
                { text: prompt },
                { inlineData: { mimeType, data: base64Data } },
              ],
            }],
            generationConfig: {
              responseMimeType: 'application/json',
              responseSchema: {
                type: 'OBJECT',
                properties: {
                  name: { type: 'STRING' },
                  category: {
                    type: 'STRING',
                    enum: ['化妝品', '保養品', '盥洗用品', '食品', '保健品', '其他'],
                  },
                  hasExpiryDate: { type: 'BOOLEAN' },
                  expiryDate: { type: 'STRING' },
                  note: { type: 'STRING' },
                },
                required: ['name', 'category', 'hasExpiryDate', 'expiryDate', 'note'],
              },
            },
          };

          const res = await fetchWithBackoff(GEMINI_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          }, 3);

          const json = await res.json();
          const text = json && json.candidates && json.candidates[0] &&
            json.candidates[0].content && json.candidates[0].content.parts &&
            json.candidates[0].content.parts[0] && json.candidates[0].content.parts[0].text;

          if (!text) throw new Error('無辨識回傳內容');

          const parsed = JSON.parse(text);
          const nameInput = $('itemName');
          const noteInput = $('itemNote');
          const expiryInput = $('itemExpiryDate');

          if (parsed.name && parsed.name.trim() && nameInput) {
            nameInput.value = parsed.name.trim();
          }
          if (parsed.category && VALID_CATEGORIES.has(parsed.category)) {
            if ((parsed.name && parsed.name.trim()) || !(nameInput && nameInput.value.trim())) {
              renderCategorySelector(parsed.category);
            }
          }
          if (parsed.note && parsed.note.trim() && noteInput && !noteInput.value.trim()) {
            noteInput.value = parsed.note.trim();
          }

          const validExpiry = parsed.hasExpiryDate ? normalizeDateStr(parsed.expiryDate) : '';
          if (expiryInput) expiryInput.value = validExpiry || '';

          updateFormExpiryPreview();

          if (statusBanner) {
            statusBanner.classList.remove('hidden');
            if (validExpiry) {
              statusBanner.className = 'status-banner is-safe';
              statusBanner.innerHTML = `已辨識完成並帶入有效期限 <strong>${escapeHtml(validExpiry)}</strong>，請確認資訊後儲存。`;
            } else {
              statusBanner.className = 'status-banner is-warn';
              statusBanner.textContent = '照片中未清楚拍到有效期限，已將期限欄留空；您可以靠近效期處重拍，或直接手動輸入。';
            }
          }
        } catch (err) {
          if (statusBanner) {
            statusBanner.classList.remove('hidden');
            statusBanner.className = 'status-banner is-expired';
            statusBanner.textContent = 'AI 辨識暫時無法完成，請重新選圖或直接手動輸入物品資訊。';
          }
        } finally {
          if (scanOverlay) scanOverlay.classList.add('hidden');
        }
      }

      /* -----------------------------------------------------------------
         10. 通知測試、設定備份、自訂確認對話框與 Toast
         ----------------------------------------------------------------- */
      function triggerNotificationTest() {
        try {
          const alerts = state.items
            .map(item => ({ item, info: evaluateItem(item) }))
            .filter(x => x.info.status === 'expired' || x.info.status === 'expiring');

          const bodyText = alerts.length > 0
            ? `有 ${alerts.length} 項囤貨快到期或已過期：${alerts.slice(0, 3).map(x => x.item.name).join('、')}${alerts.length > 3 ? '等' : ''}。`
            : '目前所有有庫存的物品都在安全效期內。';

          if (typeof Notification === 'undefined') {
            showToast(`效期提醒：${bodyText}`, 'info');
            return;
          }

          if (Notification.permission === 'granted') {
            new Notification(`${state.appName}｜效期提醒`, { body: bodyText });
            showToast('已發送瀏覽器效期通知', 'success');
          } else if (Notification.permission !== 'denied') {
            Notification.requestPermission().then(perm => {
              if (perm === 'granted') {
                try {
                  new Notification(`${state.appName}｜效期提醒`, { body: bodyText });
                  showToast('已開啟並發送瀏覽器通知', 'success');
                } catch (e) {
                  showToast(`效期提醒：${bodyText}`, 'info');
                }
              } else {
                showToast('未開啟瀏覽器通知，仍可於頂部提醒看板檢視', 'info');
              }
            }).catch(() => {
              showToast(`效期提醒：${bodyText}`, 'info');
            });
          } else {
            showToast('瀏覽器通知已被封鎖，請查看頂部效期提醒看板', 'info');
          }
        } catch (err) {
          showToast('目前環境不支援瀏覽器通知，請直接查看頂部提醒看板', 'info');
        }
      }

      function buildBackupPayload() {
        return {
          appName: state.appName,
          theme: state.theme,
          items: state.items,
        };
      }

      function exportJsonFile() {
        try {
          const str = JSON.stringify(buildBackupPayload(), null, 2);
          const blob = new Blob([str], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `stock-keeper-backup-${getTodayStr()}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('已下載 JSON 備份檔', 'success');
        } catch (err) {
          showToast('下載失敗，請嘗試改用「複製 JSON 內容」', 'error');
        }
      }

      function copyJsonToClipboard() {
        const str = JSON.stringify(buildBackupPayload(), null, 2);
        const ta = document.createElement('textarea');
        ta.value = str;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('已複製 JSON 備份到剪貼簿', 'success');
        } catch (err) {
          showToast('複製失敗，請改用下載備份檔', 'error');
        } finally {
          document.body.removeChild(ta);
        }
      }

      function openConfirm(title, message, okText, okBtnClass, onConfirm) {
        if ($('confirmTitle')) $('confirmTitle').textContent = title;
        if ($('confirmMessage')) $('confirmMessage').textContent = message;
        const okBtn = $('btnConfirmOk');
        if (okBtn) {
          okBtn.textContent = okText;
          okBtn.className = `btn btn-flex ${okBtnClass || 'btn-danger'}`;
        }
        state.pendingConfirmCallback = onConfirm;
        if ($('confirmModal')) $('confirmModal').classList.remove('hidden');
      }

      function closeConfirm() {
        if ($('confirmModal')) $('confirmModal').classList.add('hidden');
        state.pendingConfirmCallback = null;
      }

      function showToast(message, type) {
        const container = $('toastContainer');
        if (!container) return;
        const el = document.createElement('div');
        const cls = type === 'success' ? 'is-success' : (type === 'error' ? 'is-error' : '');
        el.className = `toast-item ${cls}`;
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.25s ease';
          setTimeout(() => {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 260);
        }, 2800);
      }

      /* -----------------------------------------------------------------
         11. 集中式事件委派（最先執行綁定，確保每個按鈕必定有效）
         ----------------------------------------------------------------- */
      function bindGlobalEvents() {
        document.addEventListener('click', e => {
          // 點擊主題選單外部自動收合
          if (state.themePopoverOpen) {
            const pop = $('themePopover');
            const trigger = $('btnHeaderTheme');
            if (pop && trigger && !pop.contains(e.target) && !trigger.contains(e.target)) {
              toggleThemePopover(false);
            }
          }

          const target = e.target.closest('[data-action]');
          if (!target) return;

          const action = target.getAttribute('data-action');
          const id = target.getAttribute('data-id');

          switch (action) {
            case 'start-edit-title':
              startInlineTitleEdit();
              break;

            case 'save-settings-name': {
              const inp = $('settingsAppNameInput');
              if (!inp) break;
              const nextName = applyAppName(inp.value, true);
              showToast(`已儲存名稱「${nextName}」`, 'success');
              break;
            }

            case 'toggle-theme-popover':
              e.stopPropagation();
              toggleThemePopover();
              break;

            case 'choose-theme': {
              const themeId = target.getAttribute('data-theme-id');
              const found = THEMES.find(t => t.id === themeId);
              applyTheme(themeId, true);
              toggleThemePopover(false);
              if (found) showToast(`已切換為「${found.name}」主題`, 'info');
              break;
            }

            case 'test-notif':
              triggerNotificationTest();
              break;

            case 'open-settings':
              openSettingsModal();
              break;

            case 'close-settings':
              closeSettingsModal();
              break;

            case 'backdrop-close-settings':
              if (e.target === target) closeSettingsModal();
              break;

            case 'clear-search':
              state.searchQuery = '';
              if ($('searchInput')) $('searchInput').value = '';
              renderQuickCheckBanner();
              renderItemList();
              break;

            case 'toggle-alert-board':
              state.alertBoardExpanded = !state.alertBoardExpanded;
              renderAlertBoard();
              break;

            case 'locate-item':
              if (!id) break;
              state.selectedCategory = '全部';
              state.selectedStatus = 'all';
              state.searchQuery = '';
              if ($('searchInput')) $('searchInput').value = '';
              renderAll();
              setTimeout(() => {
                const cardEl = $(`card-${id}`);
                if (cardEl) {
                  cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  cardEl.classList.remove('card-highlight');
                  void cardEl.offsetWidth;
                  cardEl.classList.add('card-highlight');
                }
              }, 30);
              break;

            case 'quick-status':
              state.selectedCategory = '全部';
              state.selectedStatus = target.getAttribute('data-status') || 'all';
              renderCategoryTabs();
              renderStatusTabs();
              renderItemList();
              break;

            case 'select-category':
              state.selectedCategory = target.getAttribute('data-category') || '全部';
              renderCategoryTabs();
              renderItemList();
              break;

            case 'select-status':
              state.selectedStatus = target.getAttribute('data-status') || 'all';
              renderStatusTabs();
              renderItemList();
              break;

            case 'stock-minus':
            case 'stock-plus': {
              if (!id) break;
              const idx = state.items.findIndex(x => x.id === id);
              if (idx === -1) break;
              const cur = Math.max(0, Number(state.items[idx].quantity) || 0);
              const next = Math.max(0, cur + (action === 'stock-plus' ? 1 : -1));
              if (next === cur) break;
              state.items[idx].quantity = next;
              saveItems();
              renderAll();
              if (next === 0) showToast(`「${state.items[idx].name}」已標示為已用完`, 'info');
              break;
            }

            case 'edit-item':
              if (id) openItemModal(id);
              break;

            case 'delete-item': {
              if (!id) break;
              const item = state.items.find(x => x.id === id);
              if (!item) break;
              openConfirm('刪除物品', `確定要刪除「${item.name}」嗎？刪除後無法復原。`, '確定刪除', 'btn-danger', () => {
                state.items = state.items.filter(x => x.id !== id);
                saveItems();
                renderAll();
                showToast('已刪除物品', 'info');
              });
              break;
            }

            case 'open-add-modal':
              openItemModal(null);
              break;

            case 'fab-camera':
              openItemModal(null);
              openLiveCamera();
              break;

            case 'fab-album':
              openItemModal(null);
              if ($('albumFileInput')) $('albumFileInput').click();
              break;

            case 'close-item-modal':
              closeItemModal();
              break;

            case 'backdrop-close-item':
              if (e.target === target) closeItemModal();
              break;

            case 'modal-camera':
              openLiveCamera();
              break;

            case 'modal-album':
              if ($('albumFileInput')) $('albumFileInput').click();
              break;

            case 'remove-photo':
              state.formThumbnail = null;
              if ($('photoPreviewImg')) $('photoPreviewImg').src = '';
              if ($('photoPreviewBox')) $('photoPreviewBox').classList.add('hidden');
              break;

            case 'pick-form-category':
              renderCategorySelector(target.getAttribute('data-category') || '其他');
              break;

            case 'form-qty-minus': {
              const inp = $('itemQty');
              if (inp) inp.value = String(Math.max(0, (parseInt(inp.value, 10) || 0) - 1));
              break;
            }

            case 'form-qty-plus': {
              const inp = $('itemQty');
              if (inp) inp.value = String(Math.min(999, (parseInt(inp.value, 10) || 0) + 1));
              break;
            }

            case 'pick-unit':
              if ($('itemUnit')) $('itemUnit').value = target.getAttribute('data-unit') || '個';
              break;

            case 'clear-expiry':
              if ($('itemExpiryDate')) $('itemExpiryDate').value = '';
              updateFormExpiryPreview();
              break;

            case 'add-months': {
              const months = Number(target.getAttribute('data-months')) || 12;
              const startInput = $('itemStartDate');
              const base = (startInput && startInput.value) || getTodayStr();
              if (startInput) startInput.value = base;
              if ($('itemExpiryDate')) $('itemExpiryDate').value = addMonths(base, months);
              updateFormExpiryPreview();
              break;
            }

            case 'delete-in-modal': {
              const editId = $('itemId') ? $('itemId').value : '';
              const item = state.items.find(x => x.id === editId);
              if (!item) break;
              closeItemModal();
              openConfirm('刪除物品', `確定要刪除「${item.name}」嗎？刪除後無法復原。`, '確定刪除', 'btn-danger', () => {
                state.items = state.items.filter(x => x.id !== editId);
                saveItems();
                renderAll();
                showToast('已刪除物品', 'info');
              });
              break;
            }

            case 'close-camera':
              closeLiveCamera();
              break;

            case 'switch-camera':
              openLiveCamera(state.cameraFacingMode === 'environment' ? 'user' : 'environment');
              break;

            case 'capture-shutter':
              captureCameraFrame();
              break;

            case 'export-json':
              exportJsonFile();
              break;

            case 'copy-json':
              copyJsonToClipboard();
              break;

            case 'load-sample':
              openConfirm('重設示範資料', '將載入 4 筆日常示範物品（包含 2 筆快到期示範），方便體驗 1/5 效期提醒與庫存功能。', '確認重設', 'btn-primary', () => {
                state.items = createDemoItems();
                saveItems();
                renderAll();
                closeSettingsModal();
                showToast('已重設為 4 筆示範資料', 'success');
              });
              break;

            case 'clear-all':
              openConfirm('清空所有資料', '這會移除清單中的全部物品資料，確定要清空嗎？', '全部清空', 'btn-danger', () => {
                state.items = [];
                saveItems();
                safeStorage.set(INIT_KEY, '1');
                renderAll();
                closeSettingsModal();
                showToast('已清空所有資料', 'info');
              });
              break;

            case 'confirm-cancel':
              closeConfirm();
              break;

            case 'backdrop-close-confirm':
              if (e.target === target) closeConfirm();
              break;

            case 'confirm-ok': {
              const cb = state.pendingConfirmCallback;
              closeConfirm();
              if (typeof cb === 'function') cb();
              break;
            }

            default:
              break;
          }
        });

        // 即時買前快搜
        document.addEventListener('input', e => {
          if (e.target && e.target.id === 'searchInput') {
            state.searchQuery = e.target.value;
            renderQuickCheckBanner();
            renderItemList();
          }
        });

        // 排序、日期、相簿選圖與 JSON 匯入
        document.addEventListener('change', async e => {
          const el = e.target;
          if (!el) return;

          if (el.id === 'sortSelect') {
            state.sortBy = el.value;
            renderItemList();
          } else if (el.id === 'itemStartDate' || el.id === 'itemExpiryDate') {
            updateFormExpiryPreview();
          } else if (el.id === 'albumFileInput') {
            const file = el.files && el.files[0];
            if (!file) return;
            try {
              const payload = await compressFileToJpeg(file);
              await runGeminiVision(payload);
            } catch (err) {
              showToast('圖片讀取失敗，請重新選擇照片', 'error');
            } finally {
              el.value = '';
            }
          } else if (el.id === 'importJsonInput') {
            const file = el.files && el.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
              try {
                const parsed = JSON.parse(ev.target.result);
                const rawItems = Array.isArray(parsed)
                  ? parsed
                  : (parsed && Array.isArray(parsed.items) ? parsed.items : null);
                if (!rawItems) throw new Error('格式錯誤');

                const cleaned = rawItems
                  .filter(x => x && typeof x.name === 'string' && x.name.trim())
                  .map((x, idx) => ({
                    id: x.id || `imp-${Date.now()}-${idx}`,
                    name: x.name.trim(),
                    category: VALID_CATEGORIES.has(x.category) ? x.category : '其他',
                    quantity: Math.max(0, Number(x.quantity) || 0),
                    unit: typeof x.unit === 'string' && x.unit.trim() ? x.unit.trim() : '個',
                    startDate: normalizeDateStr(x.startDate) || getTodayStr(),
                    expiryDate: normalizeDateStr(x.expiryDate),
                    note: typeof x.note === 'string' ? x.note : '',
                    thumbnail: typeof x.thumbnail === 'string' ? x.thumbnail : null,
                    createdAt: Number(x.createdAt) || Date.now(),
                  }));

                if (!Array.isArray(parsed)) {
                  if (typeof parsed.appName === 'string' && parsed.appName.trim()) {
                    applyAppName(parsed.appName, true);
                  }
                  if (typeof parsed.theme === 'string') {
                    applyTheme(parsed.theme, true);
                  }
                }

                state.items = cleaned;
                saveItems();
                renderAll();
                closeSettingsModal();
                showToast(`成功匯入 ${cleaned.length} 筆物品資料`, 'success');
              } catch (err) {
                showToast('匯入失敗，請確認檔案為正確的 JSON 備份格式', 'error');
              } finally {
                el.value = '';
              }
            };
            reader.readAsText(file);
          }
        });

        // 鍵盤與失焦事件（原地編輯標題）
        document.addEventListener('keydown', e => {
          if (!e.target) return;
          if (e.target.id === 'brandTitleInput') {
            if (e.key === 'Enter') {
              e.preventDefault();
              finishInlineTitleEdit(true);
            } else if (e.key === 'Escape') {
              e.preventDefault();
              finishInlineTitleEdit(false);
            }
          } else if (e.target.id === 'settingsAppNameInput' && e.key === 'Enter') {
            e.preventDefault();
            const nextName = applyAppName(e.target.value, true);
            showToast(`已儲存名稱「${nextName}」`, 'success');
          }
        });

        document.addEventListener('focusout', e => {
          if (e.target && e.target.id === 'brandTitleInput') {
            finishInlineTitleEdit(true);
          }
        });

        document.addEventListener('submit', e => {
          if (e.target && e.target.id === 'itemForm') {
            handleItemFormSubmit(e);
          }
        });
      }

      /* -----------------------------------------------------------------
         12. 啟動初始化
         ----------------------------------------------------------------- */
      function bootstrap() {
        try { bindGlobalEvents(); } catch (err) { console.error(err); }
        try { loadAppName(); } catch (err) { applyAppName(DEFAULT_APP_NAME, false); }
        try { loadTheme(); } catch (err) { applyTheme('milk-tea', false); }
        try { checkCameraSupport(); } catch (err) { state.cameraAvailable = false; }
        try { loadItems(); } catch (err) { state.items = []; }
        try { renderAll(); } catch (err) { console.error(err); }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>
</body>
</html>
